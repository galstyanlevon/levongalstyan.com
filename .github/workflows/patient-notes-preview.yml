name: Preview Patient Notes
on:
  push:
    branches: [feature/patient-notes-preview]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}preview/patient-notes/review.html
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build Patient Notes preview
        run: node scripts/preview-patient-notes.mjs
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/preview/patient-notes
      - uses: actions/checkout@v4
        with:
          ref: main
          path: current-main
      - name: Keep production from main and add isolated preview
        run: |
          mkdir -p publish/preview/patient-notes
          cp -R dist/. publish/preview/patient-notes/
          cd current-main
          node scripts/build.mjs
          cp -R dist/. ../publish/
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish
      - uses: actions/deploy-pages@v5
        id: deployment
