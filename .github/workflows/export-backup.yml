name: Export website backup

on:
  push:
    branches:
      - backup-export-2026-09-10

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out saved backup
        uses: actions/checkout@v4
        with:
          ref: backup-2026-09-10
          path: site
      - name: Remove Git metadata
        run: rm -rf site/.git
      - name: Upload website snapshot
        uses: actions/upload-artifact@v4
        with:
          name: levongalstyan-backup-2026-09-10
          path: site
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
