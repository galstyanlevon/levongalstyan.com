name: Import clean production website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-clean-site
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Import verified clean snapshot
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f index.html ]]; then
            echo "Site is already imported."
            exit 0
          fi

          archive_file="$(mktemp)"
          extraction_dir="$(mktemp -d)"
          trap 'rm -f "$archive_file"; rm -rf "$extraction_dir"' EXIT

          curl --fail --location --silent --show-error \
            "https://github.com/seregforeal/doc/archive/18c219084e44c32ded68fef5154c6750644f2717.tar.gz" \
            --output "$archive_file"
          tar -xzf "$archive_file" --directory "$extraction_dir"

          source_dir="$(find "$extraction_dir" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$source_dir"

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='README.md' \
            --exclude='.DS_Store' \
            "$source_dir/" ./

          find . -type f -name '.DS_Store' -delete

          test -f index.html
          test -f css/style.css
          test -f js/content.js
          test -f js/app.js
          node --check js/content.js
          node --check js/app.js

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No import changes detected."
            exit 0
          fi

          git commit -m "Import clean production website"
          git push origin HEAD:main
